server:
  port: 2333
  address: 0.0.0.0

lavalink:

  server:
    password: "${LAVALINK_SERVER_PASSWORD:youshallnotpass}"
    playerUpdateInterval: 5
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    youtubeSearchEnabled: false
    soundcloudSearchEnabled: false
    # gc-warnings: true
    # O YouTube vem do plugin `youtube-source` (plugins/ no container), por isso a
    # fonte embutida acima continua desligada. A busca é habilitada no bloco `plugins`.

    sources:
      local: true
      http: true
      youtube: false
      bandcamp: false
      soundcloud: false
      twitch: false
      vimeo: false
      nico: false
      
    nonAllocatingFrameBuffer: false
      
    # http:
      # proxyHost: ""
      # proxyPort: 0
      # proxyUser: ""
      # proxyPassword: ""

  # metrics:
    # prometheus:
      # enabled: false
      # endpoint: /prometheus
    # sentry:
      # dsn: ""
      # environment: ""

# Plugins (jar fica em /opt/Lavalink/plugins, copiado pelo Dockerfile).
# `youtube-source` traz a fonte de YouTube e a busca por `ytsearch:` / `ytmsearch:`,
# que o Lavalink 4.2.2 não traz mais embutido.
plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - TVHTML5_SIMPLY
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    pot:
      token: "${YOUTUBE_POT_TOKEN:}"
      visitorData: "${YOUTUBE_VISITOR_DATA:}"
    oauth:
      enabled: "${YOUTUBE_OAUTH_ENABLED:false}"
      refreshToken: "${YOUTUBE_OAUTH_REFRESH_TOKEN:}"

