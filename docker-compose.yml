services:
  mongodb:
    image: mongo:7.0
    container_name: gorillaz-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: gorillazbot
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - gorillaz-network

  lavalink:
    build:
      context: .
      dockerfile: lavalink/Dockerfile
    container_name: gorillaz-lavalink
    restart: unless-stopped
    environment:
      LAVALINK_SERVER_PASSWORD: "${LAVALINK_PASSWORD:-youshallnotpass}"
      YOUTUBE_POT_TOKEN: "${YOUTUBE_POT_TOKEN:-}"
      YOUTUBE_VISITOR_DATA: "${YOUTUBE_VISITOR_DATA:-}"
      YOUTUBE_OAUTH_ENABLED: "${YOUTUBE_OAUTH_ENABLED:-false}"
      YOUTUBE_OAUTH_REFRESH_TOKEN: "${YOUTUBE_OAUTH_REFRESH_TOKEN:-}"
    ports:
      - "2333:2333"
    volumes:
      # Uploads por anexo: mesma pasta vista pelo bot em /audio/uploads.
      - audio_uploads:/opt/Lavalink/sounds/uploads
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/2333' && echo ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - gorillaz-network

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Requerido para restaurar LuckyMonkey.Contracts do GitHub Packages privado.
        NUGET_AUTH_TOKEN: "${NUGET_AUTH_TOKEN:?Defina NUGET_AUTH_TOKEN com um PAT do GitHub que tenha read:packages antes de executar o build}"
    container_name: gorillaz-bot
    restart: unless-stopped
    env_file:
      # Real .env do bot (gitignored) — DISCORD_TOKEN e demais credenciais.
      - GorillazDiscordBot.Api/.env
    environment:
      MONGODB_CONNECTION_STRING: "mongodb://mongodb:27017"
      MONGODB_DATABASE_NAME: "gorillazbot"
      LUCKY_MONKEY_URL: "${LUCKY_MONKEY_URL:-http://localhost:8080}"
      LAVALINK_REST_URI: "http://lavalink:2333"
      LAVALINK_WS_URI: "ws://lavalink:2333/v4/websocket"
      LAVALINK_PASSWORD: "${LAVALINK_PASSWORD:-youshallnotpass}"
      LAVALINK_LOCAL_AUDIO_PATH: "sounds"
      AUDIO_INSTANT_MIRROR_BASE_URL: "${AUDIO_INSTANT_MIRROR_BASE_URL:-https://myinstants.site}"
      AUDIO_PLAYBACK_START_TIMEOUT_SECONDS: "${AUDIO_PLAYBACK_START_TIMEOUT_SECONDS:-15}"
      AUDIO_UPLOAD_PATH: "/audio/uploads"
      AUDIO_UPLOAD_MAX_MB: "${AUDIO_UPLOAD_MAX_MB:-25}"
      AUDIO_UPLOAD_MAX_MINUTES: "${AUDIO_UPLOAD_MAX_MINUTES:-10}"
      AUDIO_UPLOAD_RETENTION_DAYS: "${AUDIO_UPLOAD_RETENTION_DAYS:-30}"
      TZ: "America/Sao_Paulo"
    volumes:
      - audio_uploads:/audio/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      lavalink:
        condition: service_healthy
    networks:
      - gorillaz-network

volumes:
  mongodb_data:
  audio_uploads:

networks:
  gorillaz-network:
    driver: bridge
