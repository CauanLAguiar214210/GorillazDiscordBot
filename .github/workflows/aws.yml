name: Deploy to Amazon ECS

on:
  push:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore
      run: dotnet restore GorillazDiscordBot.sln

    - name: Build
      run: dotnet build GorillazDiscordBot.sln -c Release --no-restore

    - name: Test
      run: dotnet test GorillazDiscordBot.sln -c Release --no-build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    needs: build-and-test

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: gorillaz-discord-bot
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Render task definition from template
      id: render-template
      env:
        AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        DISCORD_TOKEN_ARN: ${{ vars.DISCORD_TOKEN_ARN }}
        OWM_API_KEY_ARN: ${{ vars.OWM_API_KEY_ARN }}
        MONGODB_CONN_ARN: ${{ vars.MONGODB_CONN_ARN }}
      run: |
        : "${AWS_ACCOUNT_ID:?AWS_ACCOUNT_ID variable nao configurado}"
        : "${DISCORD_TOKEN_ARN:?DISCORD_TOKEN_ARN variable nao configurado}"
        : "${OWM_API_KEY_ARN:?OWM_API_KEY_ARN variable nao configurado}"
        : "${MONGODB_CONN_ARN:?MONGODB_CONN_ARN variable nao configurado}"
        envsubst < task-definition.template.json > task-definition.json

    - name: Render Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition.json
        container-name: bot
        image: ${{ steps.build-image.outputs.image }}

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: gorillaz-discord-bot
        cluster: gorillaz-discord-bot
        wait-for-service-stability: true
