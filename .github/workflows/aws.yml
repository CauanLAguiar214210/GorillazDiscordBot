name: Deploy to Amazon ECS

on:
  push:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    timeout-minutes: 15
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    needs: ci

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push image to Amazon ECR
      id: build-image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ steps.login-ecr.outputs.registry }}/gorillaz-discord-bot:${{ github.sha }}
          ${{ steps.login-ecr.outputs.registry }}/gorillaz-discord-bot:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Render task definition from template
      id: render-template
      env:
        AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        DISCORD_TOKEN_ARN: ${{ vars.DISCORD_TOKEN_ARN }}
        OWM_API_KEY_ARN: ${{ vars.OWM_API_KEY_ARN }}
        MONGODB_CONN_ARN: ${{ vars.MONGODB_CONN_ARN }}
      run: |
        : "${AWS_ACCOUNT_ID:?AWS_ACCOUNT_ID variable nao configurado}"
        : "${DISCORD_TOKEN_ARN:?DISCORD_TOKEN_ARN variable nao configurado}"
        : "${OWM_API_KEY_ARN:?OWM_API_KEY_ARN variable nao configurado}"
        : "${MONGODB_CONN_ARN:?MONGODB_CONN_ARN variable nao configurado}"
        envsubst < task-definition.template.json > task-definition.json

    - name: Render Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition.json
        container-name: bot
        image: ${{ steps.login-ecr.outputs.registry }}/gorillaz-discord-bot:${{ github.sha }}

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: gorillaz-discord-bot
        cluster: gorillaz-discord-bot
        wait-for-service-stability: true
