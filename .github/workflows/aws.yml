name: Deploy to Amazon ECS

on:
  push:
    branches: [ "dev" ]

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_TASK_DEFINITION: aws/ecs/task-definition.json
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
  COMMAND_PREFIX: ${{ vars.COMMAND_PREFIX }}
  MONGODB_DATABASE_NAME: ${{ vars.MONGODB_DATABASE_NAME }}
  AWS_LOG_GROUP: ${{ vars.AWS_LOG_GROUP }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Prepare task definition
      run: |
        cp ${{ env.ECS_TASK_DEFINITION }} task-definition-rendered.json
        sed -i "s/ACCOUNT_ID/${{ env.AWS_ACCOUNT_ID }}/g" task-definition-rendered.json
        sed -i "s/CONTAINER_NAME/${{ env.CONTAINER_NAME }}/g" task-definition-rendered.json
        sed -i "s/{{COMMAND_PREFIX}}/${{ env.COMMAND_PREFIX }}/g" task-definition-rendered.json
        sed -i "s/{{MONGODB_DATABASE_NAME}}/${{ env.MONGODB_DATABASE_NAME }}/g" task-definition-rendered.json
        sed -i "s/{{AWS_LOG_GROUP}}/${{ env.AWS_LOG_GROUP }}/g" task-definition-rendered.json
        sed -i "s/{{AWS_REGION}}/${{ env.AWS_REGION }}/g" task-definition-rendered.json

    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition-rendered.json
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.build-image.outputs.image }}

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true
