name: Deploy to Amazon ECS

on:
  push:
    branches: [ "dev" ]

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "137451610933"
  ECR_REPOSITORY: gorillaz-discord-bot
  ECS_SERVICE: gorillaz-discord-bot
  ECS_CLUSTER: gorillaz-discord-bot
  ECS_TASK_DEFINITION: aws/ecs/task-definition.json
  AWS_LOG_GROUP: /ecs/gorillaz-discord-bot
  SECRETS_DISCORD_TOKEN_ARN: arn:aws:secretsmanager:us-east-1:137451610933:secret:gorillaz-discord-bot/discord-token-Sy7OML
  SECRETS_MONGODB_CONNECTION_ARN: arn:aws:secretsmanager:us-east-1:137451610933:secret:gorillaz-discord-bot/mongodb-connection-WqGVdI
  SECRETS_OWM_API_KEY_ARN: arn:aws:secretsmanager:us-east-1:137451610933:secret:gorillaz-discord-bot/owm-api-key-2o5J5H

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Prepare task definition
      run: |
        cp ${{ env.ECS_TASK_DEFINITION }} task-definition-rendered.json
        sed -i "s|ACCOUNT_ID|${{ env.AWS_ACCOUNT_ID }}|g" task-definition-rendered.json
        sed -i "s|AWS_LOG_GROUP|${{ env.AWS_LOG_GROUP }}|g" task-definition-rendered.json
        sed -i "s|AWS_REGION|${{ env.AWS_REGION }}|g" task-definition-rendered.json
        sed -i "s|SECRETS_DISCORD_TOKEN_ARN|${{ env.SECRETS_DISCORD_TOKEN_ARN }}|g" task-definition-rendered.json
        sed -i "s|SECRETS_MONGODB_CONNECTION_ARN|${{ env.SECRETS_MONGODB_CONNECTION_ARN }}|g" task-definition-rendered.json
        sed -i "s|SECRETS_OWM_API_KEY_ARN|${{ env.SECRETS_OWM_API_KEY_ARN }}|g" task-definition-rendered.json

    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition-rendered.json
        container-name: bot
        image: ${{ steps.build-image.outputs.image }}

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true
