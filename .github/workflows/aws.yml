name: Deploy to Amazon ECS

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - 'GorillazDiscordBot.Api/**'
      - 'GorillazDiscordBot.Domain/**'
      - 'GorillazDiscordBot.Infra/Repository/**'
      - 'GorillazDiscordBot.Infra/Services/**'
      - 'GorillazDiscordBot.Infra/Configuration/**'
      - 'GorillazDiscordBot.Tests/**'
      - 'GorillazDiscordBot.sln'
      - 'Dockerfile'
      - 'nuget.config'
      - 'task-definition.template.json'
      - 'docker-compose.yml'
      - 'lavalink/**'
      - 'GorillazDiscordBot.Api/Resources/**'
      - '.github/workflows/aws.yml'
      
permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    timeout-minutes: 15
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    needs: ci

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push image to Amazon ECR
      id: build-image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        build-args: |
          NUGET_AUTH_TOKEN=${{ secrets.ACOUGUE_MINERIO_TOKEN }}
        tags: |
          ${{ steps.login-ecr.outputs.registry }}/gorillaz-discord-bot:${{ github.sha }}
          ${{ steps.login-ecr.outputs.registry }}/gorillaz-discord-bot:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Lavalink image to Amazon ECR
      id: build-lavalink
      uses: docker/build-push-action@v6
      with:
        context: .
        file: lavalink/Dockerfile
        push: true
        tags: |
          ${{ steps.login-ecr.outputs.registry }}/gorillaz-lavalink:${{ github.sha }}
          ${{ steps.login-ecr.outputs.registry }}/gorillaz-lavalink:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Render task definition from template
      id: render-template
      env:
        AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        DISCORD_TOKEN_ARN: ${{ vars.DISCORD_TOKEN_ARN }}
        OWM_API_KEY_ARN: ${{ vars.OWM_API_KEY_ARN }}
        MONGODB_CONN_ARN: ${{ vars.MONGODB_CONN_ARN }}
        LUCKY_MONKEY_API_KEY_ARN: ${{ vars.LUCKY_MONKEY_API_KEY_ARN }}
        LUCKY_MONKEY_JWT_SIGNING_KEY_ARN: ${{ vars.LUCKY_MONKEY_JWT_SIGNING_KEY_ARN }}
        LAVALINK_PASSWORD_ARN: ${{ vars.LAVALINK_PASSWORD_ARN }}
      run: |
        : "${AWS_ACCOUNT_ID:?AWS_ACCOUNT_ID variable nao configurado}"
        : "${DISCORD_TOKEN_ARN:?DISCORD_TOKEN_ARN variable nao configurado}"
        : "${OWM_API_KEY_ARN:?OWM_API_KEY_ARN variable nao configurado}"
        : "${MONGODB_CONN_ARN:?MONGODB_CONN_ARN variable nao configurado}"
        : "${LUCKY_MONKEY_API_KEY_ARN:?LUCKY_MONKEY_API_KEY_ARN variable nao configurado}"
        : "${LUCKY_MONKEY_JWT_SIGNING_KEY_ARN:?LUCKY_MONKEY_JWT_SIGNING_KEY_ARN variable nao configurado}"
        : "${LAVALINK_PASSWORD_ARN:?LAVALINK_PASSWORD_ARN variable nao configurado}"
        # sanitize: remove accidental newlines/carriage-returns from variable values
        export AWS_ACCOUNT_ID=$(echo -n "$AWS_ACCOUNT_ID" | tr -d '\r\n')
        export DISCORD_TOKEN_ARN=$(echo -n "$DISCORD_TOKEN_ARN" | tr -d '\r\n')
        export OWM_API_KEY_ARN=$(echo -n "$OWM_API_KEY_ARN" | tr -d '\r\n')
        export MONGODB_CONN_ARN=$(echo -n "$MONGODB_CONN_ARN" | tr -d '\r\n')
        export LUCKY_MONKEY_API_KEY_ARN=$(echo -n "$LUCKY_MONKEY_API_KEY_ARN" | tr -d '\r\n')
        export LUCKY_MONKEY_JWT_SIGNING_KEY_ARN=$(echo -n "$LUCKY_MONKEY_JWT_SIGNING_KEY_ARN" | tr -d '\r\n')
        export LAVALINK_PASSWORD_ARN=$(echo -n "$LAVALINK_PASSWORD_ARN" | tr -d '\r\n')
        envsubst < task-definition.template.json > task-definition.json

    - name: Validate rendered task definition
      run: |
        python3 - <<'PY'
        import json, sys

        with open("task-definition.json") as f:
            td = json.load(f)

        bot = next((c for c in td["containerDefinitions"] if c["name"] == "bot"), None)
        if bot is None:
            sys.exit("::error::container 'bot' ausente no task definition")

        env = {e["name"]: e.get("value") for e in bot["environment"]}
        ws_uri = env.get("LAVALINK_WS_URI", "")
        print(f"LAVALINK_WS_URI={ws_uri}")

        if not ws_uri.endswith("/v4/websocket"):
            sys.exit(
                "::error::LAVALINK_WS_URI deve apontar para /v4/websocket "
                f"(Lavalink v4). Valor: {ws_uri}"
            )

        print("OK: endpoint WebSocket do Lavalink v4")
        PY

    - name: Render Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition.json
        container-name: bot
        image: ${{ steps.login-ecr.outputs.registry }}/gorillaz-discord-bot:${{ github.sha }}

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: gorillaz-discord-bot
        cluster: gorillaz-discord-bot
        wait-for-service-stability: true
